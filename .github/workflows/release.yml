name: Build and Release MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger of the workflow

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller SystemMonitor.spec

      - name: Build Setup.exe (standalone installer/uninstaller)
        run: |
          pyinstaller SystemMonitorSetup.spec

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress
        shell: pwsh

      - name: Add WiX Toolset to PATH
        run: |
          # Discover the actual installed WiX version dynamically instead of
          # hardcoding a version number - the chocolatey wixtoolset package
          # has moved past v3.11 (currently ships v3.14.x), and a hardcoded
          # "v3.11" path silently breaks every time the package is upgraded.
          $wixBin = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset v*\bin" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $wixBin) {
            Write-Error "Could not find a WiX Toolset 'bin' directory under 'C:\Program Files (x86)'. Is the 'Install WiX Toolset' step still working?"
            exit 1
          }
          Write-Host "Found WiX Toolset at: $wixBin"
          echo $wixBin >> $env:GITHUB_PATH
        shell: pwsh

      - name: Read app version
        id: appversion
        run: |
          $ver = (Select-String -Path "src/systemmonitor/__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $ver) {
            Write-Error "Could not read __version__ from src/systemmonitor/__init__.py"
            exit 1
          }
          Write-Host "App version: $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build MSI Installer with WiX Toolset
        run: |
          candle -ext WixUIExtension -ext WixUtilExtension -dProductVersion=${{ steps.appversion.outputs.version }} installer.wxs
          light installer.wixobj -ext WixUIExtension -ext WixUtilExtension -cultures:en-us -out dist/SystemMonitor.msi
        shell: cmd

      - name: Create GitHub Release and Upload Installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SystemMonitor.msi
            dist/SystemMonitorSetup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
